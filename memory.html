<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<meta charset="utf-8">
<title>Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Single light look: a tabletop of crayon cards. */
  :root {
    --ink: #221d38; --paper: #fffaf0; --paper2: #fff1cf; --desk: #cfe8d6; --sun: #ffd23f; --berry: #d9337f; --sky: #2f6fd1; --grass: #3fae49; --plum: #7a4bd6;
    --card: 1fr; --gap: 14px; --font: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --display: "Lilita One", "Arial Rounded MT Bold", sans-serif;
    color-scheme: light;
  }
  body.dys { --font: "Atkinson Hyperlegible", Verdana, sans-serif; letter-spacing: .02em; word-spacing: .08em; }
  body.contrast { --desk: #ffffff; --paper: #ffffff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--font); padding-inline: 16px; padding-block: 12px 24px;
    background-image: radial-gradient(rgba(34,29,56,.06) 1.5px, transparent 1.5px); background-size: 24px 24px; }
  body.contrast { background-image: none; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  h1 { font: 400 clamp(28px, 5vw, 44px) var(--display); margin: 0; line-height: 1; }
  h1 span:nth-child(1) { color: var(--berry); } h1 span:nth-child(2) { color: var(--sky); }
  .pill { font-weight: 800; font-size: 16px; padding: 4px 14px; border-radius: 999px; background: #fff; border: 3px solid var(--ink); }
  .spacer { flex: 1; }
  button.b { font: 400 18px var(--display); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 16px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  button.b.primary { background: var(--sun); }
  button.b:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  :focus-visible { outline: 4px solid var(--plum); outline-offset: 3px; }
  .board { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: var(--gap); max-width: calc(var(--cols, 4) * 170px); margin: 0 auto; width: 100%; }
  body.big .board { max-width: calc(var(--cols, 4) * 230px); --gap: 18px; }
  .card { position: relative; aspect-ratio: 3 / 4; border: 0; padding: 0; background: none; cursor: pointer; perspective: 800px; }
  .card .in { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
  .card.up .in, .card.done .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 16px; border: 4px solid var(--ink); backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
  .back { background: var(--sky); background-image: repeating-linear-gradient(-35deg, rgba(255,255,255,.18) 0 8px, transparent 8px 18px); }
  .back::after { content: "?"; font: 400 clamp(30px, 6vw, 56px) var(--display); color: #fff; -webkit-text-stroke: 2px var(--ink); }
  .card:nth-child(3n+1) .back { background-color: var(--berry); } .card:nth-child(3n+2) .back { background-color: var(--grass); }
  .front { background: #fff; transform: rotateY(180deg); grid-template-rows: 1fr auto; padding: 6px; }
  .front img { max-width: 92%; max-height: 100%; object-fit: contain; }
  .front b { font: 400 clamp(12px, 1.9vw, 17px) var(--display); text-align: center; line-height: 1.05; padding-bottom: 4px; }
  .card.done .front { background: #eaffdf; box-shadow: inset 0 0 0 4px var(--grass); }
  .card.scan .face { box-shadow: 0 0 0 6px var(--sun), 0 0 0 10px var(--ink); }
  body.contrast .face { border-width: 6px; }
  .msg { min-height: 1.5em; text-align: center; font: 400 22px var(--display); color: var(--plum); }
  .win { text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--paper); border: 4px solid var(--ink); border-radius: 24px; padding: 20px; }
  .win img { height: 110px; }
  .win h2 { font: 400 34px var(--display); margin: 0; }
  dialog { border: 4px solid var(--ink); border-radius: 22px; padding: 20px 22px; max-width: min(520px, 92vw); background: var(--paper); color: var(--ink); font-family: var(--font); }
  dialog::backdrop { background: rgba(34,29,56,.4); }
  dialog h2 { font: 400 28px var(--display); margin: 0 0 10px; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 2px dashed #e4d9bd; font-size: 17px; }
  .opt small { display: block; color: #5d5677; font-size: 14px; }
  .opt input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--grass); }
  .opt select { font: inherit; border: 3px solid var(--ink); border-radius: 10px; padding: 4px 8px; background: #fff; }
  .credit { text-align: center; font-size: 14px; color: #4d4868; }
  @media (prefers-reduced-motion: reduce) { .card .in { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1><span id="t1">Memory</span> <span id="t2">Match</span></h1>
    <span class="pill" id="level">Board 1</span>
    <span class="pill" id="moves" hidden>Moves: 0</span>
    <span class="spacer"></span>
    <button class="b" id="bSound" aria-pressed="true">Sound</button>
    <button class="b" id="bOpts">Options</button>
  </header>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="board" id="board" role="grid" aria-label="Memory cards"></div>
  <div class="win" id="win" hidden></div>
  <p class="credit" id="credit"></p>
</div>

<dialog id="opts" aria-labelledby="optsTitle">
  <h2 id="optsTitle">Options</h2>
  <div class="opt"><label for="oLang">Language<small>Words, menus and voice</small></label><select id="oLang"><option value="en">English</option><option value="fr">Français</option></select></div>
  <div class="opt"><label for="oSpeak">Read aloud<small>Says each character's name</small></label><input type="checkbox" id="oSpeak"></div>
  <div class="opt"><label for="oVoice">Voice<small>Recorded voices sound the most natural</small></label><select id="oVoice"></select></div>
  <div class="opt"><label for="oCalm">Calm mode<small>Softer sounds, slower flips, no confetti</small></label><input type="checkbox" id="oCalm"></div>
  <div class="opt"><label for="oBig">Big cards<small>Larger cards and spacing</small></label><input type="checkbox" id="oBig"></div>
  <div class="opt"><label for="oContrast">High contrast<small>Thicker outlines, plain background</small></label><input type="checkbox" id="oContrast"></div>
  <div class="opt"><label for="oDys">Easy-read letters<small>Clearer letter shapes and spacing</small></label><input type="checkbox" id="oDys"></div>
  <div class="opt"><label for="oScan">One-button play<small>Cards light up in turn. Press any key or tap anywhere to pick.</small></label><input type="checkbox" id="oScan"></div>
  <div class="opt"><label for="oScanSpeed">Light-up speed</label><select id="oScanSpeed"><option value="2000">Slow</option><option value="1400">Medium</option><option value="900">Fast</option></select></div>
  <div class="opt"><label for="oMoves">Show move counter<small>Off keeps it pressure-free</small></label><input type="checkbox" id="oMoves"></div>
  <p style="text-align:right;margin:14px 0 0"><button class="b primary" id="oDone">Done</button></p>
</dialog>

  const L = () => T[O.lang] || T.en;
  const nameOf = c => (O.lang === 'fr' && c.fr) || c.en;


  // ---- recorded voices (Voicebox). Clip file name is derived from the spoken text. ----
  const VOICES = { heart: ['Heart (female)', 'en'], bella: ['Bella (female)', 'en'], michael: ['Michael (male)', 'en'], puck: ['Puck (male)', 'en'], siwis: ['Siwis (voix féminine)', 'fr'] };
  function clipKey(text) {
    const t = text.trim().normalize('NFC'); let h = 5381;
    for (const ch of t) h = ((Math.imul(h, 33) ^ ch.codePointAt(0)) >>> 0);
    let slug = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
    return slug + '-' + h.toString(16).padStart(8, '0');
  }
  let clipAudio = null;
  function playClip(text, voice, fallback) {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    if (clipAudio) { clipAudio.pause(); clipAudio = null; }
    if (!voice || voice === 'browser' || !VOICES[voice]) { fallback(text); return; }
    const a = new Audio('voices/' + voice + '/' + clipKey(text) + '.mp3'); clipAudio = a; let fell = false;
    const fb = () => { if (!fell && clipAudio === a) { fell = true; fallback(text); } };
    a.onerror = fb; const p = a.play(); if (p && p.catch) p.catch(fb);
  }

  // ---- sound ----
  let ac = null;
  function tone(f0, f1, dur, vol, type) {
    if (!O.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = O.calm ? 'sine' : (type || 'triangle');
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const v = (O.calm ? .5 : 1) * vol; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) { /* audio optional */ }
  }
  const sfx = { flip: () => tone(500, 700, .08, .08), match: () => { tone(660, 990, .18, .12); setTimeout(() => tone(990, 1320, .2, .1), 120); }, nope: () => tone(300, 220, .25, .07), win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, .22, .12), i * 130)) };
  function say(text) {
    if (!O.speak) return;
    playClip(text, O.lang === 'fr' ? O.voiceFr : O.voiceEn, t => { try { const u = new SpeechSynthesisUtterance(t); u.lang = O.lang === 'fr' ? 'fr-CA' : 'en-US'; u.rate = O.calm ? .8 : .95; speechSynthesis.speak(u); } catch (e) { /* ignore */ } });
  }

  // ---- game ----
  let cards = [], open = [], lock = false, moves = 0, scanI = -1, scanTimer = null, focusI = 0;
  const board = $('#board');
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function deal() {
    const [pairs, cols] = BOARDS[Math.min(O.level, BOARDS.length - 1)];
    const pool = shuffle(GAME.characters.slice()).slice(0, pairs);
    cards = shuffle(pool.flatMap(c => [{ c, up: false, done: false }, { c, up: false, done: false }]));
    open = []; lock = false; moves = 0; focusI = 0;
    board.style.setProperty('--cols', cols);
    $('#win').hidden = true; board.hidden = false;
    render(); applyText(); msg(L().start); say(L().start); startScan();
  }
  function render() {
    board.innerHTML = cards.map((k, i) => `<button class="card ${k.up ? 'up' : ''} ${k.done ? 'done' : ''}" data-i="${i}" role="gridcell" tabindex="${i === focusI ? 0 : -1}"
      aria-label="${k.up || k.done ? nameOf(k.c) : (O.lang === 'fr' ? 'Carte cachée' : 'Hidden card')} ${i + 1}">
      <span class="in"><span class="face back"></span><span class="face front"><img src="${SPR[k.c.k]}" alt=""><b>${nameOf(k.c)}</b></span></span></button>`).join('');
    board.querySelectorAll('.card').forEach(b => b.addEventListener('click', e => { if (O.scan) return; flip(+b.dataset.i); }));
    $('#moves').textContent = `${L().moves}: ${moves}`;
  }
  function msg(t) { $('#msg').textContent = t; }
  function flip(i) {
    const k = cards[i]; if (lock || !k || k.up || k.done) return;
    k.up = true; open.push(i); sfx.flip(); focusI = i; setCard(i);
    if (open.length === 2) {
      moves++; $('#moves').textContent = `${L().moves}: ${moves}`;
      const [a, b] = open.map(j => cards[j]);
      if (a.c.k === b.c.k) {
        a.done = b.done = true; open.forEach(setCard); open = [];
        sfx.match(); const n = nameOf(a.c); msg(L().match(n)); say(n);
        if (cards.every(x => x.done)) setTimeout(won, O.calm ? 1100 : 700);
      } else {
        lock = true; sfx.nope(); msg(L().nope);
        setTimeout(() => { open.forEach(j => { cards[j].up = false; setCard(j); }); open = []; lock = false; }, O.calm ? 1800 : 1100);
      }
    }
  }
  function setCard(i) {
    const el = board.children[i], k = cards[i]; if (!el) return;
    el.classList.toggle('up', k.up); el.classList.toggle('done', k.done);
    el.setAttribute('aria-label', `${k.up || k.done ? nameOf(k.c) : (O.lang === 'fr' ? 'Carte cachée' : 'Hidden card')} ${i + 1}`);
  }
  function won() {
    stopScan(); sfx.win(); say(L().win);
    const last = O.level >= BOARDS.length - 1;
    const star = GAME.characters[Math.floor(Math.random() * GAME.characters.length)];
    board.hidden = true; const w = $('#win'); w.hidden = false;
    w.innerHTML = `<img src="${SPR[star.k]}" alt=""><h2>${L().win}</h2><p>${O.showMoves ? `${L().moves}: ${moves}` : ''}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="b" id="again">${L().again}</button>${last ? '' : `<button class="b primary" id="next">${L().next}</button>`}</div>`;
    if (!O.calm) confetti();
    $('#again').onclick = () => deal();
    const nx = $('#next'); if (nx) { nx.onclick = () => { O.level++; keep(); deal(); }; nx.focus(); } else $('#again').focus();
  }
  function confetti() {
    const cols = ['#e63946', '#ffd23f', '#3fae49', '#2f6fd1', '#7a4bd6', '#ff5fa2'];
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('i'); d.style.cssText = `position:fixed;left:${Math.random() * 100}vw;top:-12px;width:10px;height:14px;background:${cols[i % 6]};transform:rotate(${Math.random() * 360}deg);transition:transform 1.6s ease-in, top 1.6s ease-in;z-index:9;pointer-events:none`;
      document.body.appendChild(d); requestAnimationFrame(() => { d.style.top = '105vh'; d.style.transform = `rotate(${Math.random() * 720}deg)`; }); setTimeout(() => d.remove(), 1800);
    }
  }

  // ---- one-button scanning ----
  function startScan() {
    stopScan(); if (!O.scan) return; msg(L().scanHint);
    const tick = () => {
      const avail = cards.map((k, i) => (!k.up && !k.done ? i : -1)).filter(i => i >= 0); if (!avail.length) return;
      const pos = avail.indexOf(scanI); scanI = avail[(pos + 1) % avail.length];
      board.querySelectorAll('.card').forEach((b, i) => b.classList.toggle('scan', i === scanI));
    };
    tick(); scanTimer = setInterval(tick, +O.scanSpeed);
  }
  function stopScan() { clearInterval(scanTimer); scanTimer = null; scanI = -1; board.querySelectorAll('.scan').forEach(b => b.classList.remove('scan')); }
  function scanPick() { if (scanI >= 0 && !lock) { flip(scanI); } }
  document.addEventListener('keydown', e => {
    if ($('#opts').open) return;
    if (O.scan && !board.hidden) { if (!e.repeat && e.key !== 'Tab') { e.preventDefault(); scanPick(); } return; }
    if (board.hidden) return;
    const cols = +getComputedStyle(board).getPropertyValue('--cols') || 4, n = cards.length;
    const mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    if (mv !== undefined) { e.preventDefault(); focusI = Math.max(0, Math.min(n - 1, focusI + mv)); board.querySelectorAll('.card').forEach((b, i) => b.tabIndex = i === focusI ? 0 : -1); board.children[focusI].focus(); }
  });
  document.addEventListener('pointerdown', e => { if (O.scan && !board.hidden && !e.target.closest('header, dialog, .win')) { e.preventDefault(); scanPick(); } });

  // ---- options ----
  const map = { oSpeak: 'speak', oCalm: 'calm', oBig: 'big', oContrast: 'contrast', oDys: 'dys', oScan: 'scan', oMoves: 'showMoves' };
  function applyText() {
    const l = L(); $('#t1').textContent = l.t1; $('#t2').textContent = l.t2; $('#level').textContent = `${l.board} ${O.level + 1} / ${BOARDS.length}`;
    $('#bSound').textContent = l.sound; $('#bSound').setAttribute('aria-pressed', String(O.sound)); $('#bSound').style.opacity = O.sound ? 1 : .5;
    $('#bOpts').textContent = l.options; $('#credit').textContent = l.credit(GAME.artist); document.documentElement.lang = O.lang;
    document.body.classList.toggle('big', O.big); document.body.classList.toggle('contrast', O.contrast); document.body.classList.toggle('dys', O.dys);
    $('#moves').hidden = !O.showMoves;
  }
  function fillVoices() {
    const lang = $('#oLang').value, cur = lang === 'fr' ? O.voiceFr : O.voiceEn;
    $('#oVoice').innerHTML = Object.entries(VOICES).filter(([, v]) => v[1] === lang).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('') + `<option value="browser">${lang === 'fr' ? 'Voix de l\u2019ordinateur' : 'Computer voice'}</option>`;
    $('#oVoice').value = cur;
  }
  $('#oLang').addEventListener('change', fillVoices);
  $('#oVoice').addEventListener('change', () => { const v = $('#oVoice').value; if ($('#oLang').value === 'fr') O.voiceFr = v; else O.voiceEn = v; const was = O.speak, wl = O.lang; O.speak = true; O.lang = $('#oLang').value; say(nameOf(GAME.characters[0])); O.speak = was; O.lang = wl; });
  $('#bOpts').onclick = () => {
    $('#oLang').value = O.lang; $('#oScanSpeed').value = String(O.scanSpeed); fillVoices();
    for (const [id, k] of Object.entries(map)) $('#' + id).checked = !!O[k];
    stopScan(); $('#opts').showModal();
  };
  $('#oDone').onclick = () => $('#opts').close();
  $('#opts').addEventListener('close', () => {
    const langChanged = O.lang !== $('#oLang').value;
    O.lang = $('#oLang').value; O.scanSpeed = +$('#oScanSpeed').value;
    for (const [id, k] of Object.entries(map)) O[k] = $('#' + id).checked;
    keep(); applyText(); render(); if (langChanged) msg(L().start); startScan();
  });
  $('#bSound').onclick = () => { O.sound = !O.sound; keep(); applyText(); };
  deal();
})();
</script>

</body>
</html>
